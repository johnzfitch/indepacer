[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indepacer"
version = "0.1.0"
description = "CLI tool for PACER legal document research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zack Fitch" }]
keywords = ["pacer", "legal", "court", "docket", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyotp>=2.9",
    "requests>=2.28",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
full = [
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
pacer = "indepacer.cli:cli"

[project.urls]
Homepage = "https://github.com/zackfitch/indepacer"
Documentation = "https://pacer-lib.readthedocs.io/en/latest/"

[tool.hatch.build.targets.wheel]
packages = ["src/indepacer"]

[tool.hatch.build.targets.wheel.force-include]
"src/indepacer/data" = "indepacer/data"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
