[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pacer-cli"
version = "0.3.0"
description = "CLI tool for PACER legal document research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zack Fitch" }]
keywords = ["pacer", "legal", "court", "docket", "cli", "federal-courts", "ecf", "cm-ecf", "pcl", "legal-tech", "litigation", "case-search", "court-records"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "selectolax>=0.3.21",
    "urllib3>=2.2.2",
    "cryptography>=42.0",  # For vault encryption (AES-GCM, Scrypt)
]

[project.optional-dependencies]
full = [
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "pyflakes>=3.0",
]

[project.scripts]
pacer = "pacer_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/johnzfitch/pacer-cli"
Repository = "https://github.com/johnzfitch/pacer-cli"
Changelog = "https://github.com/johnzfitch/pacer-cli/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/johnzfitch/pacer-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pacer_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["pacer_cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
